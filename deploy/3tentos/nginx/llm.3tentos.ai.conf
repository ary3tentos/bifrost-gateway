# FASE 2 — só habilite quando um app fora da VPS precisar do gateway.
# Instalação:
#   sudo cp llm.3tentos.ai.conf /etc/nginx/sites-available/llm.3tentos.ai
#   sudo ln -s /etc/nginx/sites-available/llm.3tentos.ai /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# DNS: llm.3tentos.ai -> IP da VPS. Cert: o wildcard *.3tentos.ai já instalado em /etc/ssl/corporate
# (confira os nomes dos arquivos com: grep ssl_certificate /etc/nginx/sites-available/3tentos.ai).
#
# Só as rotas de inferência passam. UI, /api (admin), /metrics, /ws e qualquer outro path do
# Azure (files, batches, ...) recebem 404. Toda chamada ainda exige virtual key no Bifrost.

map $uri $llm_gw_allowed {
    default 0;
    # API OpenAI-compatível (pipeline completo: retries, fallbacks, usage nos streams)
    ~^/v1/(chat/completions|embeddings|responses|models)$                                1;
    ~^/openai/(v1/)?(chat/completions|embeddings|responses)$                             1;
    # Formato Azure via pipeline completo (SDK AzureOpenAI com azure_endpoint=https://llm.3tentos.ai/openai)
    ~^/openai/openai/deployments/[^/]+/(chat/completions|embeddings|responses)$          1;
    # Azure passthrough (apps que montam URL do Azure: chat-ai, Langflow, transcribe-3t, dashboard)
    ~^/azure_passthrough/openai/deployments/[^/]+/(chat/completions|embeddings|responses)$ 1;
    ~^/azure_passthrough/openai/(v1/)?responses$                                         1;
}

server {
    listen 80;
    listen [::]:80;
    server_name llm.3tentos.ai;
    return 301 https://$host$request_uri;
}

server {
    # "listen ... http2" é a sintaxe do nginx 1.18 do Ubuntu 22.04 (a mesma do site 3tentos.ai).
    # No nginx >= 1.25.1 ela só gera aviso; lá prefira "listen 443 ssl;" + "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name llm.3tentos.ai;

    ssl_certificate     /etc/ssl/corporate/certificate.crt;
    ssl_certificate_key /etc/ssl/corporate/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # O Bifrost já envia HSTS, X-Frame-Options, nosniff e Referrer-Policy: não duplicar aqui.

    client_max_body_size 50m;
    access_log /var/log/nginx/llm.3tentos.ai.access.log;
    error_log  /var/log/nginx/llm.3tentos.ai.error.log;

    location / {
        if ($llm_gw_allowed = 0) {
            return 404;
        }

        # Repassa o URI já normalizado ($uri), não o bruto: o que chega ao Bifrost é
        # exatamente o path que passou pela lista acima. Com variável no proxy_pass o
        # destino precisa ser IP literal (um hostname exigiria a diretiva "resolver").
        proxy_pass http://127.0.0.1:8081$uri$is_args$args;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming SSE
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
