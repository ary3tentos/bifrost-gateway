name: Deploy LLM Gateway (3tentos)

# Atualiza o gateway na VPS: git pull no clone parcial (/data/apps/bifrost-gateway) + deploy.sh.
# Segredos de runtime (.env) e dados (data/, backups/) são ignorados pelo git e ficam só na VPS.
# Até VPS_HOST e VPS_SSH_PRIVATE_KEY existirem, o job para em "Check VPS_HOST" sem tocar na VPS.

on:
  push:
    branches:
      - 3tentos
    paths:
      - 'deploy/3tentos/**'
      - '.github/workflows/deploy-gateway.yml'
  workflow_dispatch:

concurrency:
  group: deploy-gateway
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_USER: appuser
  REMOTE_DIR: /data/apps/bifrost-gateway

jobs:
  deploy:
    name: Deploy gateway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate config.json against the schema
        run: |
          pip install --quiet check-jsonschema
          check-jsonschema --schemafile transports/config.schema.json deploy/3tentos/config.json

      - name: Validate docker-compose.yml
        working-directory: deploy/3tentos
        run: |
          touch .env
          docker compose config --quiet

      - name: Check VPS_HOST
        run: |
          if [ -z "${{ vars.VPS_HOST }}" ]; then
            echo "VPS_HOST não configurado (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${VPS_USER}@${{ vars.VPS_HOST }}" \
            "cd ${REMOTE_DIR} && git pull --ff-only && bash deploy/3tentos/scripts/deploy.sh"
